name: Noodle IDE Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  NUDL_VERSION: 1.5.0-pre-alpha
  NUDL_BUILD_ID: NUDL-NOODLE-1.5.0-PRE-ALPHA-TEST1

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noodle-IDE-1.5.0-pre-alpha-TEST1
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.5.0-pre-alpha-test1
          name: Noodle IDE 1.5.0 Pre-Alpha TEST1
          body: |
            Noodle IDE 1.5.0-pre-alpha

            Build ID: NUDL-NOODLE-1.5.0-PRE-ALPHA-TEST1
            Developer: Stephen Jr
            Target: Android 10+ / ARM64
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
