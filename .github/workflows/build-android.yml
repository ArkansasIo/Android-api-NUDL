name: Build Noodle IDE Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write
  actions: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: Noodle-IDE-1.5.0-pre-alpha-TEST1
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: noodle-ide-1.5.0-pre-alpha-test1
          name: Noodle IDE 1.5.0 Pre-Alpha TEST1
          body: |
            Noodle IDE Android APK

            Product: Noodle IDE
            Version: 1.5.0-pre-alpha
            Build: NUDL-NOODLE-1.5.0-PRE-ALPHA-TEST1
            Developer: Stephen Jr
            Target: Android / P20 Pro first
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
